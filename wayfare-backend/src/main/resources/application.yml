# =====================================================================
# Wayfare（行走集）后端配置
# ---------------------------------------------------------------------
# 约定：
#   1. 所有密钥走「占位符 + 环境变量覆盖」，禁止写真实 Key 进本文件
#   2. L1 启动期配置 = 本文件；L2 运行期开关 = sys_config 表 + Redis（改完不重启生效）
#      读取优先级 L2 覆盖 L1，L2 未配置时回落 L1
#   3. 键名与《Wayfare 开发文档》12.2 节、P1-A 任务块保持一致，后续阶段只增不改
# =====================================================================

server:
  port: 8080
  servlet:
    # 前端 request.js 的 baseURL 是 /api，所以 context-path 必须是 /api，
    # 否则 HealthController 的真实地址就不是 /api/health
    context-path: /api

spring:
  application:
    name: wayfare-backend

  # ---------- 本地开发密钥 ----------
  # 把 GLM/DEEPSEEK/百度的 Key 写在 wayfare-backend/.env.properties 里（该文件已被 .gitignore 排除）。
  # 用 optional: 前缀是关键 —— 没有这个文件也不影响启动，
  # 别人 clone 仓库后不需要任何密钥就能把全链路跑起来（会自动回落到 Mock）。
  config:
    import: optional:file:./.env.properties

  # ---------- 数据源 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wayfare?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 密码不写进仓库：在本目录建 .env.properties（已 gitignore）填 MYSQL_ROOT_PASSWORD=你的密码
    # 也可以用系统环境变量。本地开发默认密码见 .env.properties.example 的说明
    password: "${MYSQL_ROOT_PASSWORD:}"

  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      # 池化配置生效的前提是类路径上有 commons-pool2（已在 pom 显式引入）
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ---------- Jackson ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# ---------- 应用自身标识（HealthController 回显用） ----------
app:
  name: wayfare
  version: 1.0.0

# ---------- 文件存储（映射到 FileStorageProperties，键名不可随意改） ----------
file:
  upload:
    # 上传根目录：已迁到本项目下，切勿再指向旧工作区 毕设/uploads
    upload-dir: D:/Code/Vibe coding test/Wayfare/wayfare-backend/uploads
    access-prefix: /uploads
    allowed-types: image/jpeg,image/png,image/gif,image/webp,image/bmp
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp
    max-file-size: 10485760
    watermark-text: 行走集 Wayfare
    watermark-font-size: 36
    watermark-opacity: 0.3
    watermark-color: 255,255,255

# ---------- 内容审核 ----------
content:
  audit:
    sensitive-words: 色情,暴力,赌博,毒品,诈骗,反动,政治敏感,广告推广,联系方式,涉黄,涉暴

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wayfare.entity
  configuration:
    map-underscore-to-camel-case: true
    # 用 Slf4j 实现而非 StdOutImpl：SQL 走统一日志系统，便于按级别开关
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- JWT（自建 JwtInterceptor 用，不引 Spring Security） ----------
jwt:
  # HS256 要求密钥不少于 32 字节，生产环境务必用环境变量覆盖
  secret: "${JWT_SECRET:wayfare-dev-only-secret-key-please-change-in-production-2026}"
  expiration: 604800000
  header: Authorization
  prefix: "Bearer "

# ---------- 接口文档 ----------
# 注意：context-path 是 /api，所以真实入口是
#   http://localhost:8080/api/swagger-ui/index.html
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.wayfare.controller

# =====================================================================
# 以下两段为 P1 阶段（可插拔连接器层）预留，键名与 P1-A 任务块一致。
# P0-A 尚无对应实体类，Spring 会忽略未知键，不影响启动。
# =====================================================================

# ---------- 大模型：GLM（智谱） / DeepSeek / Qwen（阿里百炼），均走 OpenAI 兼容协议 ----------
llm:
  enabled: true
  # L2 的 sys_config 优先于此（注意：改这里不够，sys_config 里有值会盖过它）
  #
  # 主力 = qwen3.8-flash。选它的理由（2026-09-20 同 prompt 实测）：
  #   · 它能把「周末」正确推算成最近的周六（2026-09-26）—— GLM 的 flash 一直算错（给成周四）；
  #   · 热起来 9~14 秒，而 glm-4.5-flash 要 70 秒（撞 90 秒超时）；
  #   · 免费档可用的模型里，它是唯一同时满足「算得对」与「装得进超时」的。
  # 降级链 = qwen → glm → deepseek：三家不同厂商，任一家过载/挂掉都能自动切换。
  # （在此之前链上实际只有 GLM 一家可用，因为 DeepSeek 未配 Key —— 等于没有降级。）
  active-provider: qwen
  fallback-order: qwen,glm,deepseek
  # 单次调用超时（毫秒）。2026-09-23 由 90000 提到 240000：
  #   实测 CANDIDATE（要吐 10~15 个点位 + 至少 3 个餐饮的长 JSON）在 90 秒必被掐断，
  #   而且 qwen 与 glm 都恰好在 90041/90043ms 断掉 —— 说明瓶颈是「长输出需要的时间」，
  #   不是某个模型的问题。90 秒这个值当初是按短输出（PARSE）估的，对长输出根本不够。
  # 注意：这是 L1 兜底值；sys_config 的 llm.timeout-ms（L2）优先，改后台参数即时生效、不用重启
  #（2026-09-23 之前 Provider 只读 L1，那个键是「假可调」的 —— 见 AbstractOpenAiCompatibleProvider）。
  timeout-ms: 240000
  providers:
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: "${QWEN_API_KEY:}"
      # ⚠️ 百炼的模型名**大小写敏感**：必须是全小写 qwen3.8-flash；
      #    写成 qwen3.8-Flash 会报 model_not_found（文案像没权限，其实是名字不对）。
      #    这个端点还聚合了 glm-5.3 / deepseek-v4-flash / kimi 等，换模型改这一行即可。
      model: qwen3.8-flash
      temperature: 0.3
      max-tokens: 4096
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: "${GLM_API_KEY:}"
      # 2026-09-23 起 = **glm-5.3-flash**（用户指定；账户已充值，按量计费）：
      #   官方规格 1M 上下文 / 128K 最大输出；定价 输入 ¥0.8、输出 ¥2.8（元/百万 token），
      #   缓存命中 ¥0.23。
      # 🚫 **实测结论：不要让它承担长结构化输出阶段（当主力）** ——
      #   短输出它是最快的：PARSE 7.2 秒 / 260 输出 token（qwen 同任务 10 秒 / 494）；
      #   但地图关闭时的 CANDIDATE（要吐 10~15 个点位的 JSON）**跑满 240 秒超时都没返回**，
      #   而 qwen 同一任务 88.6 秒就返回了。同一个输入、同一个后端、同一分钟，差异只在模型。
      #   → 现行分工：**qwen 主力**（长输出能完成），glm-5.3-flash 作短输出/降级备胎。
      #   ⚠️ 注意它在降级链里排第二：qwen 挂掉时它会先被试一次，而它可能要 hang 满 4 分钟才轮到 mock。
      # ⚠️ max-tokens 从 4096 提到 32768：4096 正是当初 glm-4.6v-flashx 长输出被截断的根因
      #   （CANDIDATE 撞满上限 → finish_reason=length → 候选池为空）。
      #   max-tokens 只是上限、不是消耗量，实际按产出 token 计费。
      # ⚠️ 历史教训保留：**glm-4.6v-flashx 同样不要当主力**（长输出截断；详见 memory/2026-09-22.md）。
      model: glm-5.3-flash
      # temperature 用官方推荐值 1（模型页原文：「推荐设置：temperature: 1、top_p: 0.95」）。
      # 实测在这个值下 JSON 输出的结构完整、点位真实（祁寯藻故里景区等），所以不再用 0.3。
      temperature: 1
      # max-tokens 16384：给长结构化输出（候选 10~15 个点位、整份行程 JSON）留足空间。
      # 注意它**不再是**「思考时长」的开关了 —— 思考量由下面的 reasoning-effort 控制，
      # 所以这里放大是安全的（只有 reasoning-effort 缺省时，放大才会变成「许可它想十几分钟」）。
      max-tokens: 16384
      # 🔴 强制思考模型的推理强度（2026-09-23 修长输出挂死的关键开关）。
      # glm-5.3-flash 不允许关闭思考，不传这个字段时它按默认高档跑 —— 实测同一个候选检索 prompt：
      #   · 默认档：60s 产出 3556 字思考、正文 0 字（非流式 → 超时且无任何响应，像挂了，其实在想）；
      #   · low：38.6s 返回 765 字思考 + 900 字正文的完整 JSON。
      # 合法取值仅 low / high / max（none/minimal/medium 会 400，code 1210）。
      reasoning-effort: low
    deepseek:
      base-url: https://api.deepseek.com/v1
      api-key: "${DEEPSEEK_API_KEY:}"
      model: deepseek-chat
      temperature: 0.3
      max-tokens: 4096

# ---------- 地图：默认整体关闭。无 AK 也能开发，关闭属「能力降级」而非功能降级 ----------
map:
  enabled: false
  baidu:
    ak: "${BAIDU_MAP_AK:}"
    base-url: https://api.map.baidu.com
    connect-timeout-ms: 3000
    read-timeout-ms: 8000

# ---------- 日志 ----------
logging:
  level:
    com.wayfare: debug
    org.springframework.web: info
    com.baomidou.mybatisplus: warn
